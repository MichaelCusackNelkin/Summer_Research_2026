[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkr-broker"
description="IBKR api using ib_async"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "ib_async",
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
markers = [
    "market_hours: tests that require US equity market to be open",
]